name: Mission Data Sync
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Checkout web repository
        uses: actions/checkout@v4
        with:
          path: web

      - name: Checkout source bitacora
        uses: actions/checkout@v4
        with:
          repository: sonda0/bitacora
          path: bitacora

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get Bitacora Commit SHA
        id: bitacora_commit
        working-directory: bitacora
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Sync Mission Data
        id: sync_run
        run: |
          python web/tools/sync_mission.py \
            --source-dir bitacora \
            --data-dir web/public/data \
            --mode github \
            --commit-sha "${{ steps.bitacora_commit.outputs.sha }}" > sync_output.txt
          cat sync_output.txt

      - name: Check for Changes
        id: check
        run: |
          if grep -q "SYNC_RESULT=NO_CHANGES" sync_output.txt; then
            echo "No changes detected in bitacora. Deployment skipped."
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          else
            echo "New transmissions or changes detected. Proceeding to build and deploy."
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure GitHub Pages
        if: steps.check.outputs.should_deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Install dependencies
        if: steps.check.outputs.should_deploy == 'true'
        working-directory: web
        run: npm install

      - name: Validate public mission data
        if: steps.check.outputs.should_deploy == 'true'
        working-directory: web
        run: python tools/validate_public_data.py

      - name: Run automated test suite
        if: steps.check.outputs.should_deploy == 'true'
        working-directory: web
        run: npm test

      - name: Build static web application
        if: steps.check.outputs.should_deploy == 'true'
        working-directory: web
        run: npm run build

      - name: Upload artifact for GitHub Pages
        if: steps.check.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: needs.sync.outputs.should_deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: sync
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
